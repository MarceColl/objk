[package]
name = "objk"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
slatedb = { version = "0.17.0", features = ["aws"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
